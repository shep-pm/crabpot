[package]
name = "crabpot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The platform-independent half of crabpot: config, globs, path entries and proxies"
repository.workspace = true
license.workspace = true
keywords.workspace = true
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# The proxies run on a runtime of their own (ADR-0006): sockets, a timer for
# the dial, and a channel to stop it, and no more.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
# Parses the head of a proxied request.
httparse = { version = "1", default-features = false }

[lints]
workspace = true
