[package]
name = "crabpot-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Test harness for crabpot, not published"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# Only the library: the probe binary calls `run_from_args`, and the `crabpot`
# binary is not wanted here.
crabpot = { path = "../crates/crabpot", default-features = false }
serde_json.workspace = true
# The probe signals a process group, which `std` has no call for, and Windows
# has no such call to make. Only the `signal` module reads it, and the version
# is the one `crabpot-core` already pulls into the lock.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

# The kernel probes: sockets by family and a user namespace through nix's safe
# calls, and `io_uring_setup`, which nix has no form of, through `libc`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false }
nix = { version = "0.31", default-features = false, features = ["sched", "socket"] }

# The AF_UNIX listener a served case answers on, and the job object a probe
# asks whether a sandboxed command is held in, which std has no form of on
# Windows. Tokio already pulls the crate into the lock.
[target.'cfg(windows)'.dependencies]
# The named pipe a served case answers on, which std has no server for. Only
# `serve` reads it.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time"] }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
