[package]
name = "crabpot-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Linux half of crabpot: the bwrap argv, the mandatory-deny walker, the seccomp filters and the dependency checks"
repository.workspace = true
license.workspace = true
keywords.workspace = true
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[dependencies]
crabpot-core.workspace = true

[target.'cfg(unix)'.dependencies]
# The user id and the access check that decide whether a directory is denied
# whole, or a bwrap is executable, and the namespace, mount, `prctl` and wait
# calls of the helper's init, and the sockets of its relay, through safe calls.
nix = { version = "0.31", default-features = false, features = ["user", "fs", "process", "sched", "mount", "signal", "socket", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The `O_TMPFILE` open the args file is opened with. std cannot ask for it.
libc = { version = "0.2", default-features = false }
# Pinned exactly: its repository was archived in 2026, and ADR-0014 keeps
# hand-written BPF over `libc` as the fallback, replaceable inside one module.
seccompiler = { version = "=0.5.0", default-features = false }

[lints]
workspace = true
