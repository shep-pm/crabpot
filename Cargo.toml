[workspace]
resolver = "3"
members = ["crates/*", "harness"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
repository = "https://github.com/shep-pm/crabpot"
license = "MIT OR Apache-2.0"
keywords = ["sandbox", "security", "agents", "bubblewrap", "seatbelt"]

[workspace.dependencies]
# A requirement here is a second copy of the version, and release-plz keeps it
# only for a crate it releases. `release-plz.toml` holds `crabpot-windows` at
# `release = false`, so nothing rewrites its requirement, and a pinned one goes
# stale on every bump: at the 0.2.0 workspace bump the old `^0.1.0` matched no
# candidate and the release PR failed to resolve the workspace (issue #195). A
# path dependency inside the workspace needs no requirement to resolve, so it
# carries none.
crabpot-core = { path = "crates/crabpot-core", version = "0.2.0" }
crabpot-linux = { path = "crates/crabpot-linux", version = "0.2.0" }
crabpot-macos = { path = "crates/crabpot-macos", version = "0.2.0" }
# ADR-0015 publishes this crate, and the Windows release slice (#165) adds its
# version back here when it flips `publish` and `release`.
crabpot-windows = { path = "crates/crabpot-windows" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde_path_to_error = { version = "0.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
# deny, not forbid: the platform sandboxes are FFI (IR-7). The one module that
# calls them allows it, and nothing else may (IR-22).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
