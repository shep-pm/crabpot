[package]
name = "crabpot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Rust sandbox runtime for AI agents, rewritten from Anthropic's sandbox-runtime"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
