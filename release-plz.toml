# release-plz owns the changelog, the version bump, the tag, the GitHub
# release and the upload. Merging the release pull request is the release,
# and release-plz-pr.yml merges it on its own once its checks pass.
#
# `release_always` stays at its default, true, on purpose. Set to false, it
# publishes only from a commit whose pull request branch starts with
# `release-plz-`, so a version bumped by hand on any other branch is stranded:
# bumped in Cargo.toml and never uploaded. shep lost two releases that way.
#
# What keeps an untested commit off crates.io is the `main` ruleset's required
# checks, not this file.

[workspace]
# Marks a GitHub release as a pre-release when the version carries a SemVer
# pre-release tag.
git_release_type = "auto"
# .coderabbit.yaml skips a pull request carrying this label. The label has to
# exist before release-plz's first pull request, and renaming it silently
# un-skips every release.
pr_labels = ["release"]

git_release_enable = true

changelog_update = true
changelog_config = "release-plz-changelog.toml"

# cargo-semver-checks against the published version, so an accidental
# breaking change fails the release pull request instead of shipping in a
# patch.
semver_check = true
# The build before the upload stays on: an upload cannot be undone.
publish_no_verify = false

# The test harness is never published, and release-plz would otherwise bump
# and tag it with the rest of the workspace. release-plz refuses to run when
# its `publish` disagrees with the harness's Cargo.toml.
[[package]]
name = "crabpot-harness"
release = false
publish = false

# The facade depends on the unpublished Linux crate on Linux and the
# unpublished Windows crate on Windows, so it cannot be published either. The
# Linux release slice (#124) and #165 remove this entry.
[[package]]
name = "crabpot"
release = false

# The Linux crate is the crate the Linux slices land in (ADR-0012). It builds
# on every runner. ADR-0012 never publishes a platform crate before it holds
# the Linux sandbox, so the Linux release slice flips these two flags and
# `publish` in its Cargo.toml.
[[package]]
name = "crabpot-linux"
release = false
publish = false

# ADR-0005 keeps upstream's `srt-win` out of crates.io under any name, so this
# crate is never published: it holds upstream's source, not crabpot's API. The
# Windows map keeps `release = false` for the same reason ADR-0012 gives for an
# empty platform crate, and no slice flips `publish`.
[[package]]
name = "crabpot-windows"
release = false
publish = false
