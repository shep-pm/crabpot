[package]
name = "crabpot-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Linux half of crabpot: the bwrap argv, the mandatory-deny walker, the seccomp filters and the dependency checks"
repository.workspace = true
license.workspace = true
keywords.workspace = true
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]
# ADR-0012 never publishes a platform crate empty. The Linux release slice
# flips this, and `release-plz.toml` with it.
publish = false

[target.'cfg(unix)'.dependencies]
# Asks the kernel whether this process may execute a file, through a safe
# call.
nix = { version = "0.31", default-features = false, features = ["fs", "user"] }

[lints]
workspace = true
