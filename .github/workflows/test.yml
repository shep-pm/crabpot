name: test
# One job per gate. Every job carries `timeout-minutes`, a ceiling against a
# hang rather than a performance budget: GitHub's default is 360.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo doc --no-deps --all-features --locked
    env:
      RUSTDOCFLAGS: -D warnings

  test:
    # Both platforms shep ships on, which disagree about filesystems and
    # signals more often than seems likely.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The differential cases run upstream's srt from npm, on macOS only.
      - if: runner.os == 'macOS'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - if: runner.os == 'macOS'
        run: npm ci
        working-directory: harness
      # `tests/deny_mach_lookup.rs` builds a Go program to prove Go's TLS works.
      - if: runner.os == 'macOS'
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Matches `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets --all-features --locked
