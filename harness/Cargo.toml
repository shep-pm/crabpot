[package]
name = "crabpot-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Test harness for crabpot, not published"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# Only the library: the probe binary calls `run_from_args`, and the `crabpot`
# binary is not wanted here.
crabpot = { path = "../crates/crabpot", default-features = false }
serde_json.workspace = true
# The probe signals a process group, which `std` has no call for. Only the
# `signal` module reads it, and the version is the one `crabpot-core` already
# pulls into the lock.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true
