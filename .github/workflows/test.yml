name: test
# One job per gate. Every job carries `timeout-minutes`, a ceiling against a
# hang rather than a performance budget: GitHub's default is 360.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # `crabpot-windows`'s whole library is `#![cfg(windows)]`, so the run
      # above lints an empty crate. Against a Windows target it lints the real
      # thing, and that is the only gate that reads the copied source, or any
      # later `cfg(windows)` block in the facade, off a Windows host.
      #
      # `rusqlite`'s `bundled` feature would build the sqlite amalgamation with
      # an MSVC compiler and archiver the Ubuntu runner does not have, so
      # `.github/stubs/` stands in for both: `clippy` and `check` compile and
      # never link, so an empty object file and an empty archive are enough.
      #
      # The package list is the crates that build for a Windows target today.
      # `crabpot-macos` and `crabpot-linux` keep unix-only test targets.
      - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: clippy x86_64-pc-windows-msvc
        env:
          CC_x86_64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubcc
          AR_x86_64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubar
        run: >-
          cargo clippy --locked --all-features --target x86_64-pc-windows-msvc
          -p crabpot -p crabpot-core -p crabpot-windows -p crabpot-harness
          --all-targets -- -D warnings
      - name: clippy aarch64-pc-windows-msvc
        env:
          CC_aarch64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubcc
          AR_aarch64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubar
        run: >-
          cargo clippy --locked --all-features --target aarch64-pc-windows-msvc
          -p crabpot -p crabpot-core -p crabpot-windows -p crabpot-harness
          --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo doc --no-deps --all-features --locked
    env:
      RUSTDOCFLAGS: -D warnings

  test:
    # Both platforms shep ships on, which disagree about filesystems and
    # signals more often than seems likely. Linux runs on both arches, because
    # upstream's seccomp filter and bwrap's mounts are built per arch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    # `ubuntu-latest` is Ubuntu 26.04 now, where the helper's nested user
    # namespace is refused (EPERM) inside bwrap even with the AppArmor sysctl
    # off. It runs on 24.04, like the arm job, under the same check name.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The differential cases run upstream's srt on every platform: Seatbelt
      # on macOS, bwrap on Linux.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
        working-directory: harness
      # What upstream's Linux runner needs, and the sysctl kelpie's Linux hosts
      # set too: bwrap cannot take its namespaces while AppArmor restricts
      # unprivileged ones.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `crates/crabpot/tests/deny_mach_lookup.rs` builds a Go program to prove Go's TLS works.
      - if: runner.os == 'macOS'
        uses: actions/setup-go@v7
        with:
          go-version: stable
      # `crabpot-linux/tests/rg_parity.rs` compares its walk with `rg`'s.
      - if: runner.os == 'Linux'
        run: sudo apt-get install --yes ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  windows:
    # The other half of the same fact: `#![cfg(windows)]` code is only built
    # and run on Windows, and upstream's Windows code has only ever failed
    # there. Both arches, because kelpie's Windows workers run on both.
    #
    # These two are not required checks until the maintainer adds them to the
    # `main` ruleset.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # A cold build here is about 80 s, incremental about 10 s, and the
      # `windows` crate dominates it. Pinned by the same commit the release
      # workflows use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked -p crabpot-windows
      # The facade routes `--srt-win` to `crabpot-windows`, which srt-win
      # relies on when it relaunches its own executable.
      - name: crabpot routes the --srt-win argument
        run: cargo test --locked -p crabpot --lib -- srt_win crabpot_as_first
      # No install has run on this job, so `windows_status()` has to read the
      # not-provisioned state off real srt-win output. The test has no libtest
      # harness: it is its own host for the `--srt-win` relaunch.
      - name: windows_status reads a machine with no install
        run: cargo test --locked -p crabpot --test windows_status
      # The runner check reads a DACL built in memory, so it needs no install
      # and no file of the runner's own: it answers what the check answers for
      # an ACE naming one account, which is what a grant for the sandbox looks
      # like.
      - name: crabpot reads a DACL on Windows
        run: cargo test --locked -p crabpot --lib -- windows::ffi
      # crabpot's own install, which elevates itself (the runner's admin
      # account takes that without a prompt), then the status it leaves, then
      # the removal. A failed native command does not stop a PowerShell step,
      # so each exit code is checked.
      - name: crabpot windows-install and windows-uninstall round trip
        run: |
          cargo build --quiet --locked -p crabpot
          # A crabpot under the profile is what `cargo install` puts there, and
          # what kelpie's binary is. It is copied before the install so the
          # profile read grant the install makes covers it: a top-level item
          # that appears after a grant stays unreadable until it runs again.
          $under = Join-Path $env:USERPROFILE 'crabpot-under-profile\crabpot.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $under) | Out-Null
          Copy-Item ./target/debug/crabpot.exe $under
          ./target/debug/crabpot.exe windows-install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --locked -p crabpot --test windows_installed
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --locked -p crabpot --test windows_sandbox
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The copied crabpot runs a command, which needs the sandbox user to
          # read it as the runner. Only the grant opens it, and before #215
          # there was no grant, which seclogon reported as "Access is denied".
          & $under -- cmd /c echo crabpot-under-profile
          if ($LASTEXITCODE -ne 0) {
            # The refusal names the refusal. The ACL names the reason, and the
            # refusal itself carries no path.
            icacls $under
            exit 1
          }
          ./target/debug/crabpot.exe windows-uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --locked -p crabpot --test windows_status
      - name: crabpot --srt-win --help prints srt-win's usage
        run: |
          $out = cargo run --quiet --locked -p crabpot -- --srt-win --help 2>&1 | Out-String
          Write-Output $out
          # clap names the program from argv[0], so the usage line says
          # `crabpot.exe`; the subcommand list is srt-win's own.
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Spawn a process inside the sandbox') { exit 1 }

  windows-harness:
    # The differential cases on Windows, which run upstream's `srt-win` path
    # alone on every case that means Windows, and crabpot too on the cases
    # `WINDOWS_READY` in `harness/tests/cases.rs` names. Both arches, as above,
    # and not required checks until the maintainer adds them to the ruleset.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
        working-directory: harness
      # Upstream's own one-time install: the `srt-sandbox` account, the WFP
      # filters, and read access to the runner's profile. It elevates itself,
      # and the runner's admin account takes that without a prompt.
      - run: node harness/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup toolchain install stable --profile minimal
      # The install is shared: upstream's satisfies crabpot's `windows_status()`.
      - run: cargo test --locked -p crabpot --test windows_installed
      - run: cargo test --locked -p crabpot-harness
      # Upstream refuses a session whose `network.allowLocalBinding` is not the
      # loopback mode the filters were installed with, in either direction. The
      # pass above ran the cases that leave loopback closed, so the filters are
      # installed again with it open, and the cases that open it run now.
      - run: node harness/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install --allow-loopback --force
      - run: cargo test --locked -p crabpot-harness --test cases
        env:
          CRABPOT_HARNESS_LOOPBACK: open

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Matches `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets --all-features --locked
      # The lint job's cross-target clippy, at the MSRV: `windows`, `cc` and
      # `rusqlite` are target-specific dependencies the host jobs never build,
      # and a bump that needs a newer compiler than shep's MSRV should say so
      # here rather than on a Windows runner. Same stubs, same reason.
      - run: rustup target add --toolchain 1.88 x86_64-pc-windows-msvc
      - name: check x86_64-pc-windows-msvc
        env:
          CC_x86_64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubcc
          AR_x86_64_pc_windows_msvc: ${{ github.workspace }}/.github/stubs/stubar
        run: >-
          cargo +1.88 check --locked --all-features --target x86_64-pc-windows-msvc
          -p crabpot -p crabpot-core -p crabpot-windows -p crabpot-harness
          --all-targets
