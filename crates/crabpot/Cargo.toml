[package]
name = "crabpot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Rust sandbox runtime for AI agents, rewritten from Anthropic's sandbox-runtime"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords.workspace = true
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[features]
# Option: `cli` builds the `crabpot` binary. The library, `run_from_args`
# included, does not need it, so a host that only links crabpot leaves it off.
default = ["cli"]
cli = []

[[bin]]
name = "crabpot"
required-features = ["cli"]

[dependencies]
crabpot-core.workspace = true
# The wrapper waits on its child and on SIGINT and SIGTERM, and no more.
tokio = { version = "1", default-features = false, features = ["rt", "process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
crabpot-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
crabpot-linux.workspace = true

[target.'cfg(windows)'.dependencies]
crabpot-windows.workspace = true

[lints]
workspace = true
