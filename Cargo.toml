[workspace]
resolver = "3"
members = ["crates/*", "harness"]

[workspace.package]
version = "0.5.6"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
repository = "https://github.com/shep-pm/crabpot"
license = "MIT OR Apache-2.0"
keywords = ["sandbox", "security", "agents", "bubblewrap", "seatbelt"]

[workspace.dependencies]
# A requirement here is a second copy of the version, and release-plz keeps it
# only for a crate it releases. One that `release-plz.toml` holds back goes
# stale on every bump (issue #195), so a crate that stops being released drops
# its requirement here too.
crabpot-core = { path = "crates/crabpot-core", version = "0.5.6" }
crabpot-linux = { path = "crates/crabpot-linux", version = "0.5.6" }
crabpot-macos = { path = "crates/crabpot-macos", version = "0.5.6" }
crabpot-windows = { path = "crates/crabpot-windows", version = "0.5.6" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde_path_to_error = { version = "0.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
# deny, not forbid: the platform sandboxes are FFI (IR-7). The one module that
# calls them allows it, and nothing else may (IR-22).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
