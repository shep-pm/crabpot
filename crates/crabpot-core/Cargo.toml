[package]
name = "crabpot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The platform-independent half of crabpot: config, globs, path entries and proxies"
repository.workspace = true
license.workspace = true
keywords.workspace = true
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# The proxies run on a runtime of their own (ADR-0006): sockets, a timer for
# the dial, and a channel to stop it, and no more.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
# Parses the head of a proxied request.
httparse = { version = "1", default-features = false }
# The OS's own random bytes, for the token and a socket's name, on every
# platform.
getrandom = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# Lists this host's interface addresses, which std cannot, through a safe call.
nix = { version = "0.31", default-features = false, features = ["net"] }
# The socket calls `unix_socket` makes, because neither std nor nix binds a
# path longer than `sun_path`.
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# `GetAdaptersAddresses`, which lists this host's interface addresses. Tokio
# already pulls the crate into the lock.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[lints]
workspace = true
